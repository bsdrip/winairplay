name: build

# Each push: tests on Linux and Windows, then the Windows installer.
# A tag "v1.2.3" (or a manual run with a version) also creates a release
# with the installer.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Create a release with this version (example: 0.2.0). Empty: build only."
        required: false

permissions:
  contents: write

env:
  # FFmpeg build that the installer includes (https://github.com/GyanD/codexffmpeg).
  FFMPEG_VERSION: "9.0.2"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        run: go test ./...

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version
        run: |
          $release = "false"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1); $release = "true"
          } elseif ("${{ github.event.inputs.release_version }}" -ne "") {
            $version = "${{ github.event.inputs.release_version }}".TrimStart("v"); $release = "true"
          } else {
            $version = "0.0.0-dev." + $env:GITHUB_SHA.Substring(0, 7)
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE=$release" >> $env:GITHUB_ENV
          Write-Host "version $version, release $release"

      - name: Download FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:FFMPEG_VERSION -R GyanD/codexffmpeg -p "*essentials_build.zip" -D ffdl
          $zip = Get-ChildItem ffdl\*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath ffdl\x
          New-Item -ItemType Directory -Force dist\ffmpeg | Out-Null
          Copy-Item (Get-ChildItem ffdl\x -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist\ffmpeg\ffmpeg.exe
          Copy-Item (Get-ChildItem ffdl\x -Recurse -Filter LICENSE | Select-Object -First 1).FullName dist\ffmpeg\LICENSE
          "FFMPEG_ZIP=$($zip.Name)" >> $env:GITHUB_ENV
          "FFMPEG_SHA256=$((Get-FileHash $zip.FullName -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV
          (Resolve-Path dist\ffmpeg).Path >> $env:GITHUB_PATH
          & dist\ffmpeg\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Test on Windows
        run: |
          go vet ./...
          go test ./internal/mirror ./cmd/...
          go test ./internal/airplay -v -run "FFmpeg|Resampler|PCM|AnnexB|ListedName|Loopback"

      - name: Options of the hardware encoders in this FFmpeg build
        continue-on-error: true
        run: |
          foreach ($e in "hevc_amf","hevc_nvenc","hevc_qsv","hevc_mf","h264_amf") {
            Write-Host "== $e"
            & dist\ffmpeg\ffmpeg.exe -hide_banner -h encoder=$e | Select-String -Pattern "^\s+-(aud|header_insertion_mode|usage|preset|tune|rc|rate_control|scenario|async_depth|zerolatency|forced-idr|forced_idr|latency|profile)\s" | ForEach-Object { $_.Line }
          }

      - name: Build
        run: |
          New-Item -ItemType Directory -Force dist\app | Out-Null
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=$env:VERSION" -o dist\app\winairplay.exe .\cmd\winairplay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Start test of the application
        run: |
          $log = "$env:LOCALAPPDATA\winairplay\winairplay.log"
          # Two saved devices, so that the device list has contents.
          New-Item -ItemType Directory -Force "$env:APPDATA\winairplay" | Out-Null
          '{"encoder":"auto","fps":30,"knownDevices":[{"name":"Living Room","model":"AppleTV14,1","ip":"192.168.0.15","port":7000,"deviceID":"AA:BB:CC:DD:EE:01"},{"name":"Bedroom TV","model":"QN65","ip":"192.168.0.30","port":7000}]}' | Set-Content "$env:APPDATA\winairplay\settings.json" -Encoding utf8
          # Start in the background (no window), then start again: the second
          # start must make the first instance show its window.
          $p = Start-Process dist\app\winairplay.exe -ArgumentList "--background" -PassThru
          Start-Sleep -Seconds 4
          if ($p.HasExited) { Write-Host "winairplay stopped with exit code $($p.ExitCode)"; if (Test-Path $log) { Get-Content $log }; exit 1 }
          $second = Start-Process dist\app\winairplay.exe -PassThru
          Start-Sleep -Seconds 14
          if (-not $second.HasExited) { Write-Host "the second instance did not exit"; exit 1 }
          if ($p.HasExited) { Write-Host "winairplay stopped after the second start"; exit 1 }
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class W { [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string t);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr dc, uint f);
            public struct RECT { public int L, T, R, B; } }
          "@
          $h = [W]::FindWindow("WinAirPlayMain", "winairplay")
          $visible = [W]::IsWindowVisible($h)
          Write-Host "main window handle $h, visible $visible"
          try {
            Add-Type -AssemblyName System.Drawing
            $r = New-Object W+RECT
            [W]::GetWindowRect($h, [ref]$r) | Out-Null
            $bmp = New-Object System.Drawing.Bitmap ($r.R - $r.L), ($r.B - $r.T)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $dc = $g.GetHdc(); [W]::PrintWindow($h, $dc, 2) | Out-Null; $g.ReleaseHdc($dc); $g.Dispose()
            $bmp.Save("$PWD\dist\window.png")
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\dist\window.png"))
            Write-Host "SHOT-BEGIN"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { Write-Host ("SHOT:" + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))) }
            Write-Host "SHOT-END"
          } catch { Write-Host "screenshot failed: $_" }
          Stop-Process -Id $p.Id -Force
          Get-Content $log
          Remove-Item "$env:APPDATA\winairplay\settings.json"
          if (-not (Select-String -Path $log -Pattern "started" -Quiet)) { exit 1 }
          if (-not $visible) { Write-Host "the second start did not show the window"; exit 1 }

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" installer\winairplay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Test the installer
        run: |
          $setup = (Get-ChildItem dist\winairplay-setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/LOG=dist\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content dist\install.log -Tail 40; exit 1 }
          $app = "$env:LOCALAPPDATA\Programs\winairplay"
          foreach ($f in "winairplay.exe","ffmpeg.exe","LICENSE.txt","FFMPEG-LICENSE.txt") {
            if (-not (Test-Path "$app\$f")) { Write-Host "missing $f"; Get-ChildItem $app; exit 1 }
          }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\winairplay.lnk")) { Write-Host "no Start menu entry"; exit 1 }
          $run = Start-Process "$app\winairplay.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($run.HasExited) { Write-Host "the installed program stopped"; exit 1 }
          $un = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$app\winairplay.exe") { Write-Host "uninstall left winairplay.exe"; exit 1 }
          Write-Host "install, start and uninstall are correct"

      - uses: actions/upload-artifact@v4
        with:
          name: winairplay-setup
          path: dist/winairplay-setup-*.exe

      - name: Release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem dist\winairplay-setup-*.exe | Select-Object -First 1)
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          $notes = @"
          ## Install

          Download **$($setup.Name)** and run it. Windows SmartScreen shows a warning, because the installer has no code signature: select *More info*, then *Run anyway*. The installer needs no administrator rights.

          After the installation, winairplay is in the Start menu. It shows an icon in the notification area of the taskbar.

          ## Contents

          - winairplay $env:VERSION (tray application)
          - FFmpeg $env:FFMPEG_VERSION essentials build from gyan.dev (``$env:FFMPEG_ZIP``, SHA-256 ``$env:FFMPEG_SHA256``), licensed under the GPL v3. Source: https://github.com/GyanD/codexffmpeg and https://ffmpeg.org

          SHA-256 of the installer: ``$hash``
          "@
          $notes = ($notes -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          Set-Content -Path dist\notes.md -Value $notes -Encoding utf8
          gh release create "v$env:VERSION" $setup.FullName --target $env:GITHUB_SHA --title "winairplay $env:VERSION" --notes-file dist\notes.md
